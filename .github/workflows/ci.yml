name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: e5-2026-cnn
          MYSQL_USER: user
          MYSQL_PASSWORD: userpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      MYSQL_DATABASE: e5-2026-cnn
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    defaults:
      run:
        working-directory: e5-2026-cnn/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e5-2026-cnn/api/requirements.txt

      - name: Initialiser le schéma de la base
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mysql-client-core-8.0
          mysql -h 127.0.0.1 -P 3306 -u root -prootpassword \
            e5-2026-cnn < ../data/db/init.sql

      - name: Installer les dépendances
        run: |
          grep -vE '^(torch|torchvision)==|^(torch|torchvision)$|^--' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt

      - name: Lancer pytest
        run: pytest -v
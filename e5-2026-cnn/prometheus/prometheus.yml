global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-cnn
    metrics_path: /metrics
    static_configs:
      - targets: ["web:80"]
        labels:
          application: e5-2026-cnn